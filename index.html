<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FileBeam — Connect to PC</title>
<style>
  :root {
    --bg:#0a0b10; --card:#13141c; --border:#1e2030;
    --accent:#6c63ff; --accent2:#00d4aa;
    --text:#eceef4; --muted:#8b8fa3;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .glow1{position:fixed;top:-100px;left:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(108,99,255,0.15),transparent 70%);pointer-events:none}
  .glow2{position:fixed;bottom:-80px;right:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,170,0.1),transparent 70%);pointer-events:none}
  .container{max-width:480px;margin:0 auto;padding:24px 16px 40px;position:relative;z-index:1}

  .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .logo-box{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#4c5aff,#9650ff,#00d4aa);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .logo-text{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .logo-sub{font-size:0.7rem;color:var(--muted);margin-top:1px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px}
  .card-title{font-size:0.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}

  .code-input-row{display:flex;gap:8px}
  .code-input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:1.4rem;font-weight:700;padding:12px 14px;text-align:center;letter-spacing:.2em;outline:none;-webkit-appearance:none}
  .code-input:focus{border-color:var(--accent)}

  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:white;box-shadow:0 6px 20px rgba(108,99,255,.35)}
  .btn-primary:active{transform:scale(.97);opacity:.9}
  .btn-success{background:linear-gradient(135deg,#00d4aa,#00b89c);color:#001a15;margin-top:8px}
  .btn-secondary{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);margin-top:8px}

  .status-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;text-align:center;display:none}
  .status-card.show{display:block}
  .status-icon{font-size:2.5rem;margin-bottom:8px}
  .status-title{font-size:1rem;font-weight:700;margin-bottom:4px}
  .status-sub{font-size:0.8rem;color:var(--muted)}

  .dot-live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:blink 1.2s ease-in-out infinite;margin-right:6px}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .upload-zone{background:var(--card);border:2px dashed var(--border);border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:14px;cursor:pointer;display:none}
  .upload-zone.show{display:block}
  .upload-zone.drag{border-color:var(--accent);background:rgba(108,99,255,.05)}
  .upload-icon{font-size:2.5rem;margin-bottom:10px}
  .upload-title{font-size:1rem;font-weight:700;margin-bottom:4px}
  .upload-sub{font-size:.8rem;color:var(--muted);line-height:1.5}
  .chosen-name{font-size:.8rem;color:var(--accent2);margin-top:8px;font-weight:500}

  .progress-wrap{display:none;margin-top:14px}
  .progress-bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;width:0%;transition:width .3s}
  .progress-text{font-size:.75rem;color:var(--muted);text-align:center;margin-top:4px}

  .result-box{display:none;background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.25);border-radius:12px;padding:14px;text-align:center;margin-top:14px}
  .result-box.error{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25)}
  .result-icon{font-size:1.8rem;margin-bottom:6px}
  .result-text{font-size:.85rem;font-weight:600}
  .result-sub{font-size:.75rem;color:var(--muted);margin-top:3px}

  .receive-list{margin-top:12px}
  .receive-item{background:rgba(0,212,170,.06);border:1px solid rgba(0,212,170,.15);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .receive-name{font-size:.85rem;font-weight:600;flex:1}
  .receive-size{font-size:.75rem;color:var(--muted)}

  .text-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;display:none}
  .text-card.show{display:block}
  textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;padding:10px 12px;resize:vertical;min-height:80px;outline:none}
  textarea:focus{border-color:var(--accent)}
  #fileInput{display:none}
</style>
</head>
<body>
<div class="glow1"></div>
<div class="glow2"></div>
<div class="container">

  <!-- Logo -->
  <div class="logo-row">
    <div class="logo-box">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <rect x="2" y="14" width="7" height="8" rx="1.5" fill="#fff" opacity=".9"/>
        <rect x="15" y="2" width="7" height="8" rx="1.5" fill="#fff" opacity=".9"/>
        <path d="M9 18h3M15 6H12M12 18l6-12" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
        <circle cx="12" cy="12" r="1.5" fill="#fff"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">FileBeam</div>
      <div class="logo-sub">Phone ↔ PC Transfer</div>
    </div>
  </div>

  <!-- Enter Code -->
  <div class="card" id="codeSection">
    <div class="card-title">Enter Code from PC Extension</div>
    <div class="code-input-row">
      <input class="code-input" id="codeInput" type="number" maxlength="6" placeholder="123456">
    </div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="connectWithCode()">Connect to PC</button>
    <div id="codeError" style="color:#f87171;font-size:.8rem;margin-top:8px;display:none"></div>
  </div>

  <!-- Connected status -->
  <div class="status-card" id="connectedCard">
    <div class="status-icon"><span class="dot-live"></span>🖥️</div>
    <div class="status-title">Connected to PC!</div>
    <div class="status-sub" id="connectedSub">Ready to transfer files</div>
  </div>

  <!-- Upload Zone (Phone → PC) -->
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📤</div>
    <div class="upload-title">Tap to send file to PC</div>
    <div class="upload-sub">Any file · No size limit*<br>Photos, videos, docs — anything</div>
    <div class="chosen-name" id="chosenName"></div>
  </div>
  <input type="file" id="fileInput" multiple>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-text" id="progressText">Sending…</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="result-box" id="fileResult">
    <div class="result-icon" id="resultIcon">✅</div>
    <div class="result-text" id="resultText">Sent!</div>
    <div class="result-sub" id="resultSub">File saved to PC → Downloads/FileBeam</div>
  </div>

  <button class="btn btn-primary" id="sendFileBtn" style="display:none" onclick="sendFiles()">📤 Send to PC</button>

  <!-- Text send -->
  <div class="text-card" id="textCard">
    <div class="card-title">Send Text / Link to PC</div>
    <textarea id="textInput" placeholder="Type or paste a message, URL…"></textarea>
    <button class="btn btn-secondary" onclick="sendText()" style="margin-top:8px">📋 Send Text to PC</button>
    <div class="result-box" id="textResult" style="margin-top:8px">
      <div class="result-icon">✅</div>
      <div class="result-text">Text sent to PC!</div>
    </div>
  </div>

  <!-- Files received FROM PC -->
  <div id="receiveSection" style="display:none">
    <div class="card-title" style="margin-top:8px">Files from PC</div>
    <div class="receive-list" id="receiveList"></div>
  </div>

</div>

<script>
// ══════════════════════════════════════════
//  FileBeam Phone Receiver — Firebase Signaling
// ══════════════════════════════════════════

const FIREBASE_URL = 'https://filebeam-8ec51-default-rtdb.asia-southeast1.firebasedatabase.app';

let pc = null;
let dc = null;
let roomCode = null;
let pollTimer = null;
let lastMsgCount = 0;

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
];

// Firebase helpers
async function fbGet(path) {
  try {
    const res = await fetch(`${FIREBASE_URL}/${path}.json`);
    return await res.json();
  } catch(e) { return null; }
}
async function fbSet(path, data) {
  try {
    await fetch(`${FIREBASE_URL}/${path}.json`, {
      method: 'PUT',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'application/json' }
    });
    return true;
  } catch(e) { return false; }
}
async function fbPush(path, data) {
  try {
    await fetch(`${FIREBASE_URL}/${path}.json`, {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'application/json' }
    });
    return true;
  } catch(e) { return false; }
}

// ── Read code from URL if present ──────
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    document.getElementById('codeInput').value = code;
    connectWithCode();
  }
});

function showError(msg) {
  const el = document.getElementById('codeError');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

// ── Connect with 6-digit code ──────────
async function connectWithCode() {
  const code = document.getElementById('codeInput').value.trim();
  if (!code || code.length !== 6) { showError('Enter the 6-digit code from the extension'); return; }
  roomCode = code;

  document.getElementById('codeSection').style.opacity = '0.5';

  // Check if room exists on Firebase
  const room = await fbGet(`room/${code}`);
  if (!room) {
    showError('Room not found. Check code or make sure PC extension is running.');
    document.getElementById('codeSection').style.opacity = '1';
    return;
  }

  // Setup WebRTC as phone (answerer)
  await setupWebRTC(code);
}

// ── Setup WebRTC ───────────────────────
async function setupWebRTC(code) {
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  pc.ondatachannel = (event) => {
    dc = event.channel;
    dc.binaryType = 'arraybuffer';
    setupDataChannel(dc);
  };

  pc.onicecandidate = async (event) => {
    if (event.candidate) {
      const ts = Date.now();
      await fbSet(`room/${code}/phone_ice/${ts}`, {
        candidate: event.candidate,
        ts: ts
      });
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') onConnected();
    if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') onDisconnected();
  };

  // Signal phone is ready
  await fbSet(`room/${code}/phone_ready`, { ts: Date.now() });

  // Poll for PC offer
  let attempts = 0;
  let lastPcIceTs = 0;
  const waitForOffer = setInterval(async () => {
    attempts++;
    if (attempts > 30) {
      clearInterval(waitForOffer);
      showError('PC not responding. Make sure extension is open and running.');
      document.getElementById('codeSection').style.opacity = '1';
      return;
    }

    const offerData = await fbGet(`room/${code}/offer`);
    if (offerData && offerData.sdp) {
      clearInterval(waitForOffer);

      await pc.setRemoteDescription(new RTCSessionDescription(offerData.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await fbSet(`room/${code}/answer`, { sdp: answer, ts: Date.now() });

      // Now poll for PC ICE candidates
      const icePoller = setInterval(async () => {
        const iceData = await fbGet(`room/${code}/pc_ice`);
        if (iceData && typeof iceData === 'object') {
          const candidates = Object.values(iceData);
          for (const c of candidates) {
            if (c.ts > lastPcIceTs && c.candidate) {
              lastPcIceTs = c.ts;
              try { await pc.addIceCandidate(new RTCIceCandidate(c.candidate)); } catch(e) {}
            }
          }
        }
        if (pc.connectionState === 'connected') clearInterval(icePoller);
      }, 1000);
    }
  }, 1000);
}

function onConnected() {
  document.getElementById('codeSection').style.display = 'none';
  document.getElementById('connectedCard').classList.add('show');
  document.getElementById('uploadZone').classList.add('show');
  document.getElementById('sendFileBtn').style.display = 'block';
  document.getElementById('textCard').classList.add('show');
  document.getElementById('receiveSection').style.display = 'block';
}

function onDisconnected() {
  document.getElementById('connectedCard').querySelector('.status-title').textContent = 'Disconnected';
  document.getElementById('connectedCard').querySelector('.status-sub').textContent = 'Refresh to reconnect';
}

// ── Data channel ───────────────────────
let sendBuffer = [];
let sendMeta   = null;
let recvBuffer = [];
let recvMeta   = null;
let recvBytes  = 0;

function setupDataChannel(channel) {
  channel.onopen = () => { console.log('DC open'); onConnected(); };
  channel.onmessage = (e) => handleIncoming(e.data);
  channel.onerror   = (e) => console.error('DC error', e);
}

function handleIncoming(data) {
  if (typeof data === 'string') {
    let msg; try { msg = JSON.parse(data); } catch { return; }

    if (msg.type === 'file_start') {
      recvMeta  = { name: msg.name, size: msg.size, mimeType: msg.mimeType };
      recvBuffer = [];
      recvBytes  = 0;
    }
    if (msg.type === 'file_end') saveReceivedFile();
    if (msg.type === 'text') showReceivedText(msg.text);
    return;
  }

  if (data instanceof ArrayBuffer) {
    recvBuffer.push(data);
    recvBytes += data.byteLength;
    if (recvMeta) {
      const pct = Math.round((recvBytes / recvMeta.size) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = `Receiving ${recvMeta.name} — ${pct}%`;
      document.getElementById('progressWrap').style.display = 'block';
    }
  }
}

function saveReceivedFile() {
  if (!recvMeta) return;
  const blob = new Blob(recvBuffer, { type: recvMeta.mimeType || 'application/octet-stream' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = recvMeta.name;
  a.click();
  URL.revokeObjectURL(url);

  // Add to list
  const list = document.getElementById('receiveList');
  const item = document.createElement('div');
  item.className = 'receive-item';
  item.innerHTML = `<span style="font-size:1.2rem">📥</span><div><div class="receive-name">${recvMeta.name}</div><div class="receive-size">${formatBytes(recvMeta.size)}</div></div>`;
  list.prepend(item);

  document.getElementById('progressWrap').style.display = 'none';
  recvBuffer = []; recvMeta = null; recvBytes = 0;
}

function showReceivedText(text) {
  const t = document.getElementById('textInput');
  if (t) t.value = text;
}

// ── Send files to PC ───────────────────
let selectedFiles = [];

document.getElementById('fileInput').addEventListener('change', () => {
  selectedFiles = Array.from(document.getElementById('fileInput').files);
  if (selectedFiles.length > 0) {
    document.getElementById('chosenName').textContent = selectedFiles.length === 1
      ? selectedFiles[0].name : `${selectedFiles.length} files selected`;
  }
});

async function sendFiles() {
  if (selectedFiles.length === 0) { document.getElementById('fileInput').click(); return; }
  if (!dc || dc.readyState !== 'open') { alert('Not connected to PC'); return; }

  const CHUNK = 64 * 1024;
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const progressWrap = document.getElementById('progressWrap');
  const fileResult   = document.getElementById('fileResult');

  progressWrap.style.display = 'block';
  fileResult.style.display = 'none';

  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    const buf  = await file.arrayBuffer();

    dc.send(JSON.stringify({ type: 'file_start', name: file.name, size: file.size, mimeType: file.type }));

    let offset = 0;
    while (offset < buf.byteLength) {
      while (dc.bufferedAmount > 16 * 1024 * 1024) await new Promise(r => setTimeout(r, 50));
      const chunk = buf.slice(offset, offset + CHUNK);
      dc.send(chunk);
      offset += chunk.byteLength;
      const pct = Math.round(((i + offset/buf.byteLength) / selectedFiles.length) * 100);
      progressFill.style.width = pct + '%';
      progressText.textContent = `${file.name} — ${Math.round(offset/buf.byteLength*100)}%`;
    }

    dc.send(JSON.stringify({ type: 'file_end', name: file.name }));
  }

  progressFill.style.width = '100%';
  setTimeout(() => {
    progressWrap.style.display = 'none';
    fileResult.style.display = 'block';
    document.getElementById('resultText').textContent = selectedFiles.length === 1
      ? `${selectedFiles[0].name} sent!` : `${selectedFiles.length} files sent!`;
    document.getElementById('resultSub').textContent = 'Saved to PC → Downloads/FileBeam';
    selectedFiles = [];
    document.getElementById('chosenName').textContent = '';
    document.getElementById('fileInput').value = '';
  }, 400);
}

async function sendText() {
  const text = document.getElementById('textInput').value.trim();
  if (!text || !dc || dc.readyState !== 'open') return;
  dc.send(JSON.stringify({ type: 'text', text }));
  document.getElementById('textResult').style.display = 'block';
  document.getElementById('textInput').value = '';
  setTimeout(() => document.getElementById('textResult').style.display = 'none', 3000);
}

function formatBytes(b) {
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(1) + ' GB';
}
</script>
</body>
</html>
